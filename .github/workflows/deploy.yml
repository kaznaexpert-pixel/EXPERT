# Автодеплой на Fornex при push в main. Секреты задать в Settings → Secrets and variables → Actions:
#   FORNEX_HOST   — хост/IP Fornex (напр. y98451.hostru07.fornex.host)
#   FORNEX_USER   — ssh-пользователь (напр. y98451)
#   FORNEX_SSH_KEY — приватный ssh-ключ (весь, включая BEGIN/END)
#   FORNEX_DEPLOY_CMD — команда деплоя на сервере (напр.: ~/deploy-kaznaexpert.sh)
# Примечание: SSH на Fornex слушает нестандартный порт 20022.

name: Deploy to Fornex

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FORNEX_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 20022 -H "${{ secrets.FORNEX_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (git pull + hook on server)
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 20022 "${{ secrets.FORNEX_USER }}@${{ secrets.FORNEX_HOST }}" \
            "${{ secrets.FORNEX_DEPLOY_CMD }}"

      - name: Reset OPcache
        run: |
          curl -fsS --max-time 30 "https://kaznaexpert.ru/opcache-reset.php?key=f866fb8e8c3b90b3df10bd6bd2472e66" || echo "opcache reset call failed (non-fatal)"

      - name: IndexNow - submit changed pages
        run: |
          KEY=2573174835e1132625600007910356f3
          BEFORE='${{ github.event.before }}'
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then BEFORE="${{ github.sha }}~1"; fi
          mapfile -t files < <(git diff --name-only "$BEFORE" "${{ github.sha }}" | grep 'index\.php$' || true)
          urls=()
          for f in "${files[@]}"; do
            d=$(dirname "$f")
            case "$d" in architecture*|*_build*|php*|cms*) continue;; esac
            if [ "$d" = "." ]; then urls+=('"https://kaznaexpert.ru/"'); else urls+=("\"https://kaznaexpert.ru/$d/\""); fi
          done
          if [ ${#urls[@]} -eq 0 ]; then echo "Нет изменённых страниц - IndexNow не нужен"; exit 0; fi
          list=$(IFS=,; echo "${urls[*]}")
          body="{\"host\":\"kaznaexpert.ru\",\"key\":\"$KEY\",\"keyLocation\":\"https://kaznaexpert.ru/$KEY.txt\",\"urlList\":[$list]}"
          echo "Отправляю в IndexNow ${#urls[@]} URL:"; printf '%s\n' "${urls[@]}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json' -d "$body")
          echo "IndexNow HTTP $code"
